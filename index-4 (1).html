<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Damas Cassiano</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #11152b;
  color: white;
  font-family: Arial, sans-serif;
  padding: 16px;
}

.app {
  width: min(720px, 100%);
  text-align: center;
}

h1 {
  margin: 0 0 8px;
}

.info {
  color: #bfc6e8;
  margin-bottom: 16px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 16px;
}

button,
select {
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 15px;
  cursor: pointer;
  background: #30385f;
  color: white;
}

button:hover {
  background: #465180;
}

#newGame {
  background: #7356df;
}

#status {
  min-height: 24px;
  margin: 12px 0;
  font-weight: bold;
  color: #ffd166;
}

.board {
  width: min(92vw, 600px);
  aspect-ratio: 1;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border: 8px solid #35283a;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 15px 40px #0008;
}

.cell {
  border: 0;
  border-radius: 0;
  padding: 0;
  display: grid;
  place-items: center;
}

.light {
  background: #eddcb9;
  cursor: default;
}

.dark {
  background: #805638;
  cursor: pointer;
}

.selected {
  outline: 5px solid #ffd166;
  outline-offset: -5px;
}

.possible::after {
  content: "";
  width: 25%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #ffd166;
}

.capture::after {
  background: #ff5869;
  width: 35%;
}

.piece {
  width: 72%;
  aspect-ratio: 1;
  border-radius: 50%;
  z-index: 1;
  border: 4px solid #0004;
  box-shadow:
    inset -7px -8px #0004,
    inset 5px 5px #fff4,
    0 5px 8px #0007;
}

.red {
  background: linear-gradient(145deg, #ff8991, #bf304c);
}

.black {
  background: linear-gradient(145deg, #707994, #1b2039);
}

.king::after {
  content: "♛";
  display: grid;
  place-items: center;
  height: 100%;
  color: #ffd166;
  font-size: clamp(18px, 5vw, 34px);
}

.rules {
  color: #aab2d4;
  font-size: 13px;
  margin-top: 14px;
}
</style>
</head>

<body>
<main class="app">
  <h1>Jogo de Damas Cassiano</h1>

  <div class="info">
    Modo solo: você joga com as peças vermelhas contra a CPU.
  </div>

  <div class="controls">
    <label>
      Nível:
      <select id="level">
        <option value="easy">Fácil</option>
        <option value="medium">Médio</option>
        <option value="hard">Difícil</option>
      </select>
    </label>

    <button id="newGame">Novo jogo</button>
  </div>

  <div id="status">Escolha uma peça vermelha.</div>

  <div id="board" class="board" aria-label="Tabuleiro de damas"></div>

  <div class="rules">
    As capturas são obrigatórias. Clique em uma peça e depois na casa destacada.
  </div>
</main>

<script>
(() => {
  const SIZE = 8;
  const HUMAN = "r";
  const CPU = "b";

  let board = [];
  let turn = HUMAN;
  let selected = null;
  let movesForSelected = [];
  let gameOver = false;
  let thinking = false;

  const boardElement = document.getElementById("board");
  const statusElement = document.getElementById("status");
  const levelElement = document.getElementById("level");
  const newGameButton = document.getElementById("newGame");

  const inside = (row, col) =>
    row >= 0 && row < SIZE && col >= 0 && col < SIZE;

  const dark = (row, col) =>
    (row + col) % 2 === 1;

  const copyBoard = value =>
    value.map(row =>
      row.map(piece => piece ? { ...piece } : null)
    );

  function createBoard() {
    const result = Array.from(
      { length: SIZE },
      () => Array(SIZE).fill(null)
    );

    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < SIZE; col++) {
        if (dark(row, col)) {
          result[row][col] = {
            color: CPU,
            king: false
          };
        }
      }
    }

    for (let row = 5; row < SIZE; row++) {
      for (let col = 0; col < SIZE; col++) {
        if (dark(row, col)) {
          result[row][col] = {
            color: HUMAN,
            king: false
          };
        }
      }
    }

    return result;
  }

  function directions(piece) {
    if (piece.king) {
      return [
        [-1, -1],
        [-1, 1],
        [1, -1],
        [1, 1]
      ];
    }

    return piece.color === HUMAN
      ? [[-1, -1], [-1, 1]]
      : [[1, -1], [1, 1]];
  }

  function getMoves(position, color) {
    const captures = [];
    const normalMoves = [];

    for (let row = 0; row < SIZE; row++) {
      for (let col = 0; col < SIZE; col++) {
        const piece = position[row][col];

        if (!piece || piece.color !== color) {
          continue;
        }

        for (const [rowStep, colStep] of directions(piece)) {
          const nextRow = row + rowStep;
          const nextCol = col + colStep;

          if (!inside(nextRow, nextCol)) {
            continue;
          }

          const jumpRow = row + rowStep * 2;
          const jumpCol = col + colStep * 2;

          if (
            position[nextRow][nextCol] &&
            position[nextRow][nextCol].color !== color &&
            inside(jumpRow, jumpCol) &&
            !position[jumpRow][jumpCol]
          ) {
            captures.push({
              from: [row, col],
              to: [jumpRow, jumpCol],
              capture: [nextRow, nextCol]
            });
          } else if (!position[nextRow][nextCol]) {
            normalMoves.push({
              from: [row, col],
              to: [nextRow, nextCol]
            });
          }
        }
      }
    }

    return captures.length ? captures : normalMoves;
  }

  function makeMove(position, move) {
    const result = copyBoard(position);

    const [fromRow, fromCol] = move.from;
    const [toRow, toCol] = move.to;

    const piece = {
      ...result[fromRow][fromCol]
    };

    result[fromRow][fromCol] = null;

    if (move.capture) {
      result[move.capture[0]][move.capture[1]] = null;
    }

    if (
      (piece.color === HUMAN && toRow === 0) ||
      (piece.color === CPU && toRow === SIZE - 1)
    ) {
      piece.king = true;
    }

    result[toRow][toCol] = piece;

    return result;
  }

  function count(position, color) {
    return position
      .flat()
      .filter(piece => piece && piece.color === color)
      .length;
  }

  function draw() {
    boardElement.innerHTML = "";

    const destinations = new Map(
      movesForSelected.map(move => [
        move.to.join(","),
        move
      ])
    );

    for (let row = 0; row < SIZE; row++) {
      for (let col = 0; col < SIZE; col++) {
        const cell = document.createElement("button");
        const key = `\({row},\){col}`;
        const move = destinations.get(key);

        cell.className =
          `cell ${dark(row, col) ? "dark" : "light"}`;

        if (
          selected &&
          selected[0] === row &&
          selected[1] === col
        ) {
          cell.classList.add("selected");
        }

        if (move) {
          cell.classList.add(
            move.capture ? "capture" : "possible"
          );
        }

        cell.addEventListener("click", () => {
          clickCell(row, col);
        });

        const piece = board[row][col];

        if (piece) {
          const pieceElement = document.createElement("span");

          pieceElement.className =
            `piece ${
              piece.color === HUMAN ? "red" : "black"
            }${piece.king ? " king" : ""}`;

          cell.appendChild(pieceElement);
        }

        boardElement.appendChild(cell);
      }
    }
  }

  function clickCell(row, col) {
    if (
      gameOver ||
      thinking ||
      turn !== HUMAN
    ) {
      return;
    }

    const selectedMove = movesForSelected.find(move =>
      move.to[0] === row &&
      move.to[1] === col &&
      selected &&
      move.from[0] === selected[0] &&
      move.from[1] === selected[1]
    );

    if (selectedMove) {
      playHumanMove(selectedMove);
      return;
    }

    const piece = board[row][col];

    if (!piece || piece.color !== HUMAN) {
      return;
    }

    const available = getMoves(board, HUMAN).filter(move =>
      move.from[0] === row &&
      move.from[1] === col
    );

    if (!available.length) {
      statusElement.textContent =
        "Essa peça não possui movimentos disponíveis.";
      return;
    }

    selected = [row, col];
    movesForSelected = available;

    statusElement.textContent =
      available.some(move => move.capture)
        ? "Captura obrigatória: escolha a casa vermelha."
        : "Escolha uma casa destacada.";

    draw();
  }

  function playHumanMove(move) {
    board = makeMove(board, move);
    selected = null;
    movesForSelected = [];
    turn = CPU;

    draw();

    if (finishIfNeeded()) {
      return;
    }

    thinking = true;
    statusElement.textContent = "A CPU está pensando...";
    draw();

    setTimeout(playCpu, 350);
  }

  function finishIfNeeded() {
    const possible = getMoves(board, turn);

    if (
      !count(board, turn) ||
      !possible.length
    ) {
      gameOver = true;

      statusElement.textContent =
        turn === CPU
          ? "Você venceu! 🎉"
          : "A CPU venceu. Clique em Novo jogo para tentar novamente.";

      draw();
      return true;
    }

    return false;
  }

  function evaluate(position) {
    let score = 0;

    for (let row = 0; row < SIZE; row++) {
      for (let col = 0; col < SIZE; col++) {
        const piece = position[row][col];

        if (!piece) {
          continue;
        }

        let value = piece.king ? 6 : 3;

        if (!piece.king) {
          value += piece.color === CPU
            ? row * 0.1
            : (7 - row) * 0.1;
        }

        score += piece.color === CPU
          ? value
          : -value;
      }
    }

    return score;
  }

  function minimax(position, color, depth, alpha, beta) {
    const moves = getMoves(position, color);

    if (depth === 0 || !moves.length) {
      return evaluate(position);
    }

    if (color === CPU) {
      let best = -Infinity;

      for (const move of moves) {
        best = Math.max(
          best,
          minimax(
            makeMove(position, move),
            HUMAN,
            depth - 1,
            alpha,
            beta
          )
        );

        alpha = Math.max(alpha, best);

        if (beta <= alpha) {
          break;
        }
      }

      return best;
    }

    let best = Infinity;

    for (const move of moves) {
      best = Math.min(
        best,
        minimax(
          makeMove(position, move),
          CPU,
          depth - 1,
          alpha,
          beta
        )
      );

      beta = Math.min(beta, best);

      if (beta <= alpha) {
        break;
      }
    }

    return best;
  }

  function chooseCpuMove() {
    const moves = getMoves(board, CPU);
    const level = levelElement.value;

    if (level === "easy") {
      return moves[
        Math.floor(Math.random() * moves.length)
      ];
    }

    const depth = level === "medium" ? 2 : 4;

    let bestScore = -Infinity;
    let choices = [];

    for (const move of moves) {
      const score = minimax(
        makeMove(board, move),
        HUMAN,
        depth - 1,
        -Infinity,
        Infinity
      );

      if (score > bestScore) {
        bestScore = score;
        choices = [move];
      } else if (score === bestScore) {
        choices.push(move);
      }
    }

    return choices[
      Math.floor(Math.random() * choices.length)
    ] || moves[0];
  }

  function playCpu() {
    const moves = getMoves(board, CPU);

    if (!moves.length) {
      thinking = false;
      finishIfNeeded();
      return;
    }

    board = makeMove(board, chooseCpuMove());
    turn = HUMAN;
    thinking = false;
    movesForSelected = [];

    draw();

    if (finishIfNeeded()) {
      return;
    }

    statusElement.textContent =
      getMoves(board, HUMAN).some(move => move.capture)
        ? "Sua vez: você precisa capturar."
        : "Sua vez: escolha uma peça vermelha.";

    draw();
  }

  function newGame() {
    board = createBoard();
    turn = HUMAN;
    selected = null;
    movesForSelected = [];
    gameOver = false;
    thinking = false;

    statusElement.textContent =
      "Escolha uma peça vermelha.";

    draw();
  }

  newGameButton.addEventListener("click", newGame);
  newGame();
})();
</script>

</body>
</html>
